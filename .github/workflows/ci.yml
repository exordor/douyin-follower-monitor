name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Check syntax and types
        run: npm run check

      - name: Test doctor
        run: npm run test:doctor

      - name: Test monitor state
        run: npm run test:state

      - name: Test dashboard
        run: npm run test:dashboard

      - name: Privacy check
        run: npm run privacy:check

      - name: Test debug bundle
        run: npm run test:debug-bundle

      - name: Test agent skills
        run: npm run test:skills

      - name: Build demo pages
        run: npm run pages:build
